# Golden panchang cases, tested against दाते पंचांग (Date Panchang).
#
# STATUS: 0 of 60 cases transcribed. Every `expected` block below is empty, so
# every case reports PENDING and none of them passes. That is deliberate and it
# is the honest state of the build: nobody has yet opened the almanac.
#
# CLAUDE.md N2 makes one named panchang the reference truth, and CLAUDE.md 11
# Phase 1 says to stop and report a mismatch rather than tune a constant to force
# a pass. A case with no transcribed value therefore cannot pass - the harness
# reports it as pending, and `tools/golden_verify.py` prints what is missing.
#
# HOW TO FILL ONE IN
# ------------------
# Open the दाते पंचांग page for the case's date, and copy its printed *local*
# times into that case's `expected` block. Times are IST (or the place's own
# zone) in 24-hour HH:MM, exactly as printed - do not convert to UTC. Keys use
# the engine's identifiers from core/enums.py, e.g. tithi_key: panchami.
#
# Available fields (omit any the almanac does not print):
#   times  : sunrise sunset moonrise moonset tithi_end nakshatra_end yoga_end
#            karana_end rahu_kaal_start rahu_kaal_end abhijit_start abhijit_end
#   values : tithi_key paksha nakshatra_key nakshatra_pada yoga_key karana_key
#            vara_key month_key month_anomaly shaka_year tithi_anomaly ritu_key
#            ayana ishtakaal_ghati ishtakaal_pala
#
# Example of a filled case:
#
#   - id: ordinary-01-2024-01-26
#     date: "2024-01-26"
#     place: pune
#     tags: [ordinary]
#     source: "Date Panchang 2023-24, p. 41"
#     expected:
#       sunrise: "07:13"
#       sunset: "18:33"
#       tithi_key: purnima
#       tithi_end: "20:36"
#
# Any field left out stays pending. Any field filled in is asserted to the
# minute and will fail the build if the engine disagrees - which is the point.
#
# The scenario tags are load-bearing: tests/golden/test_golden_panchang.py
# asserts that every scenario CLAUDE.md 9.1 names is represented, so this file
# cannot quietly lose a hard case.

