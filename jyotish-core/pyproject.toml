[project]
name = "jyotish-core"
version = "1.0.0"
description = "Deterministic Jyotish (Vedic astrology) computation engine matched to a named Marathi panchang authority"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }

# The deterministic engine's dependencies, and nothing else. `core/` must run
# with only these installed (CLAUDE.md 1: zero dependency on FastAPI or the LLM
# client), which is what keeps the extras below genuinely optional.
dependencies = [
    "pyswisseph>=2.10.3.2",
    "PyYAML>=6.0",
    "tzdata>=2024.1",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
# The orchestration layer (CLAUDE.md 1). `timezonefinder` is here rather than in
# the core dependencies because only the geocoder endpoint uses it.
api = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.30",
    "SQLAlchemy>=2.0",
    "cryptography>=43.0",
    "timezonefinder>=6.5",
]
# The narrative layer is optional by design: with it uninstalled every endpoint
# still works and /v1/narrative returns the locale refusal string.
narrative = ["anthropic>=0.34"]
pdf = ["weasyprint>=62.0", "pypdf>=5.0", "fonttools>=4.53"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "api*", "narrative*", "render*"]

[tool.setuptools.package-data]
core = ["rules/data/*.yaml", "milan/data/*.yaml", "facts/schema/*.json"]
api = ["data/*.json"]
# The Devanagari font is bundled, not fetched (CLAUDE.md 2.2: "Subset and
# self-host"). A missing font file is a silent PDF failure, so it ships in the
# wheel rather than being downloaded at runtime.
render = ["fonts/*.ttf"]

# ---------------------------------------------------------------------------
# CI gates (CLAUDE.md section 9.7)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

# CLAUDE.md is the supplied specification and must stay verbatim. Recent ruff
# versions format Python code blocks inside Markdown, which would silently edit
# the spec's own `BirthInput` sketch.
extend-exclude = ["CLAUDE.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # ambiguous-unicode: Devanagari is intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["core", "api", "narrative", "render", "tools"]

[[tool.mypy.overrides]]
# Third-party packages that ship no stubs. Each is confined to one module:
# pyswisseph to the ephemeris adapter (CLAUDE.md 2.1), the rest to `render/` and
# the narrative transport, so an untyped import cannot leak into the engine.
module = ["swisseph", "timezonefinder", "weasyprint", "pypdf", "fontTools.*", "anthropic"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "golden: regression test against the published panchang authority",
    "pending_transcription: golden case whose authority values are not yet transcribed",
    "slow: property/fuzz tests over wide date ranges",
]

[tool.coverage.run]
# Everything is measured, but only `core/` is *gated* at 90% (CLAUDE.md 9.7).
# The gate stays on the engine deliberately: an uncovered branch in `render/` is
# a cosmetic risk, an uncovered branch in `core/` is a wrong number. CI runs the
# core gate as its own step so the spec's threshold is checked in isolation.
source = ["core", "api", "narrative", "render"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]
