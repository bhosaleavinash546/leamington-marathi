name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calculator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # package.json engines: >=22 <23, and both images run 22
          cache: npm
          cache-dependency-path: calculator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -p tsconfig.build.json --noEmit

      # Includes the SW engine smoke test (computeSWProgram must construct a
      # result without throwing) — guards the infinite-recursion class of bug
      # that once shipped the feature completely broken.
      - name: Unit tests
        run: npm test
        env:
          # Enforce the CAD feature-detection eval floor (current aggregate ≈0.96).
          CAD_GOLDEN_MIN_F1: '0.90'

      - name: Production build
        run: npm run build

      # Headless smoke-launch: boot the BUILT app in a real browser, drive it into
      # the SW Should-Cost panel, run a calculation, fail on any uncaught page error.
      # Catches crash-on-load bugs that unit tests cannot see.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Headless smoke-launch
        run: npm run test:e2e

      # Full browser run: the built app on the real server (air-gapped, own data
      # folder, signed-in user) — every commodity on its defaults, Assembly,
      # Excel and PDF exports, and an STL upload from file to cost. Any page
      # error or browser dialog fails it.
      - name: Full browser run
        run: npm run test:e2e:full

      - name: Upload full-run screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-failure
          path: calculator/e2e/full-failure.png
          if-no-files-found: ignore

      # Visual regression: screenshot key screens (auth, home, money-screen hero,
      # empty state) in dark + light and diff against committed baselines. Fails
      # on unintended layout/colour drift — the class of bug (e.g. a CSS-class
      # collision) that a green build otherwise hides. If a change is intentional,
      # regenerate: `npm run test:visual -- --update` and commit e2e/baselines.
      # Non-blocking: the screenshot harness's readiness probe is flaky on the CI
      # runner (server binds but the loopback probe intermittently won't connect),
      # so a broken gate must not block deploys. It still runs and reports; re-arm
      # as a hard gate once the harness readiness is reliable.
      - name: Visual regression
        run: npm run test:visual
        continue-on-error: true

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: calculator/e2e/visual-diffs/
          if-no-files-found: ignore
