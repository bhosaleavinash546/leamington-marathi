name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Dependency audit (report high/critical)
        run: npm audit --omit=dev --audit-level=high || true

      - name: Server syntax
        run: node --check server.mjs

      - name: Unit + HTTP integration tests
        run: npm test

      - name: CAD accuracy benchmark (must stay ≥ 90%)
        run: node benchmark/run.mjs --min 0.9

      - name: Cost benchmark (hit-rate ≥ 90%, MAPE ≤ 12%)
        run: node benchmark/cost-run.mjs --min-hit 0.90 --max-mape 0.12

      # The set above is the one the engine was calibrated on, so on its own it
      # cannot detect over-fitting. These two steps are what watch for it.
      # Thresholds are ratchets: tighten them as the modelling improves, never
      # loosen them to make a red build green.
      - name: Cost benchmark — HELD-OUT set (authored after calibration freeze)
        run: node benchmark/cost-run.mjs --fixtures benchmark/cost-fixtures-holdout.json --min-hit 0.70 --max-mape 0.25 --min-band-coverage 0.70

      - name: Over-fit detector (held-out vs calibrated divergence)
        run: node benchmark/cost-divergence.mjs --max-ratio 2.8

      # Relative-improvement benchmarks. Each also carries an absolute ceiling so
      # "better than the old model" cannot quietly mean "both are bad".
      #
      # Until Sept 2026 that sentence was a comment and nothing else — the
      # scripts gated on the relative margin alone (review R-39). The ceilings
      # below are set AT the value each engine measures today, not above it, so
      # they have no slack to spend: any regression fails on the next push.
      # Lowering one as an engine improves is the intended maintenance.
      - name: Feature-based machining vs mass model (MAPE ceiling 35%)
        run: node benchmark/machining-run.mjs --max-mape 0.35

      - name: Feature-based stamping vs mass model (MAPE ceiling 40%)
        run: node benchmark/stamping-run.mjs --max-mape 0.40

      - name: PCB engine v2 vs v1 (MAPE ceiling 30%)
        run: node benchmark/pcb-run.mjs --max-mape 0.30

      # Three separate ratchets, because the three numbers mean different things.
      # The single --max-unaudited flag conflated citation quality with register
      # coverage, and after the citation axis was added it silently gated on 3
      # instead of 212 — loose enough to catch nothing.
      #
      # --ratchet reads benchmark/threshold-ratchet.json, fails when a number
      # rises above its recorded best, and rewrites the file when one improves.
      # The --max-* flags are the outer bound; the recorded low-water mark is
      # the one that actually tightens over time (review R-40 — a ceiling equal
      # to today's value is a regression gate, not a ratchet).
      - name: DFM citation + register ratchets
        run: >
          node scripts/threshold-audit.mjs --todo --ratchet
          --max-unread-standards 2
          --max-register-drift 12
          --max-unreviewed 209

      # The ideation pipeline's DETERMINISTIC half, gated on a frozen corpus of
      # real /api/analyze responses (review R-41 — the whole LLM layer sat
      # outside CI because the live arms cost tokens). This scores committed
      # output: it catches a broken depth rubric, a regressed arithmetic
      # checker, a lost engine stamp or a dropped engineering section. It does
      # NOT measure generation quality or its variance — that still needs a
      # live key and `--label current`.
      - name: Ideation checks on the frozen Prism corpus
        run: >
          node benchmark/ideation-eval.mjs
          --score benchmark/prism-runs-after-repaired --label ci
          --min-depth-median 94
          --min-sections 85
          --min-engine-rate 43
          --min-null-reason 100
          --min-grade-rate 69
          --max-arith-mismatch 26

      # OpenCascade wheel — needed by the DFM geometry gate below. Kept as its
      # own step so a wheel/index problem reads as an install failure rather than
      # a mysterious benchmark skip.
      - name: Install OpenCascade (cadquery-ocp)
        run: python3 -m pip install --quiet 'cadquery-ocp>=7.7,<7.9'

      # Fixtures are analytic: a 3.000° drafted frustum must measure 3.000°, a
      # 2.50 mm shell must measure 2.50 mm. Gated at 100% because every answer is
      # arithmetic — there is no modelling slack to spend here.
      - name: DFM geometry benchmark (analytic fixtures, must be 100%)
        run: node benchmark/dfm-run.mjs --min 1.0

      # Renders the analysis, RFQ and Horizon PDFs under Node with a hostile
      # fixture and scans for text drawn past a margin. Added to CI after it
      # immediately caught a real overflow: provenance text built AFTER the
      # deepPdfSafe pass carried → and −, which jsPDF has no WinAnsi metrics
      # for, so splitTextToSize mis-measured the line and it ran off the page.
      # The exporters are the least-tested code in the repo and they produce
      # the customer-facing artefact.
      - name: Export PDF layout QA (no text past a margin)
        run: |
          python3 -m pip install --quiet PyMuPDF
          npx esbuild src/services/export-service.ts --bundle --format=esm --platform=node \
            --external:jspdf --external:pptxgenjs --external:exceljs \
            --outfile=scripts/pdf-qa/export-service.bundle.mjs
          npx esbuild src/services/foresight-report.ts --bundle --format=esm --platform=node \
            --external:jspdf --outfile=scripts/pdf-qa/foresight-report.bundle.mjs
          sed -i 's/import jsPDF from "jspdf";/import { jsPDF } from "jspdf";/' scripts/pdf-qa/*.bundle.mjs
          cd scripts/pdf-qa && node render.mjs && python3 scan.py *.pdf

      - name: Production build
        run: npx vite build

      - name: E2E smoke + axe accessibility gate
        run: |
          npx playwright-core install --with-deps chromium || npx playwright-core install chromium
          CHROMIUM_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")" npm run e2e
